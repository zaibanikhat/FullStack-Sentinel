version: '3.8'

services:
  # Web Frontend (React App served by Nginx)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sentinel_web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # API Backend (Node.js)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: sentinel_api
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgres://user:password@db:5432/sentineldb
      - REDIS_URL=redis://:password@redis:6379/0
      - REDIS_PASSWORD=password
      - API_KEY=${API_KEY}
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./fixtures:/usr/src/app/fixtures:ro
      - ./fixtures:/fixtures:ro
  # PostgreSQL Database
  db:
    image: postgres:13-alpine
    container_name: sentinel_db
    environment:
      - POSTGRES_DB=sentineldb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sentineldb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: sentinel_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data: